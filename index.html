<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portuguese Tile Generator</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body class="flex flex-col min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
  <header class="flex items-center justify-between border-b border-slate-200 px-4 py-3 dark:border-slate-700">
    <div class="flex items-center gap-3">
      <img src="tile.svg" alt="" class="h-10 w-10" />
      <h1 class="text-xl font-semibold" data-i18n="title"></h1>
    </div>
    <div class="flex gap-2">
      <button id="lang-toggle" type="button" data-i18n-title="langToggle" class="rounded border border-slate-300 px-3 py-1 text-sm dark:border-slate-600"></button>
      <button id="theme-toggle" type="button" data-i18n-title="themeToggle" class="rounded border border-slate-300 px-3 py-1 text-sm dark:border-slate-600">&#9680;</button>
    </div>
  </header>

  <main class="flex-1 mx-auto max-w-6xl gap-6 p-4">
    <section class="space-y-4 mb-6">
      <h2 class="text-lg font-semibold" data-i18n="about"></h2>
      <p class="text-sm leading-relaxed text-slate-700 dark:text-slate-300" data-i18n="aboutText"></p>
      <h2 class="text-lg font-semibold" data-i18n="instructions"></h2>
      <ul class="space-y-1 text-sm text-slate-700 dark:text-slate-300" data-i18n="instructionsList"></ul>
    </section>

    <div class="grid gap-6 md:grid-cols-[22rem_1fr]">
    <section class="space-y-4">
      <h2 class="text-lg font-medium" data-i18n="params"></h2>
      <form id="params" class="space-y-4" onsubmit="return false">
        <label class="block text-sm"><span data-i18n="size"></span> <span class="text-slate-500" data-i18n="sizeHint"></span>
          <input id="size" type="number" min="15" max="200" value="60" class="mt-1 block w-full rounded border border-slate-300 bg-white px-2 py-1 dark:border-slate-600 dark:bg-slate-800" />
        </label>
        <label class="block text-sm"><span data-i18n="numColors"></span>
          <select id="numColors" class="mt-1 block w-full rounded border border-slate-300 bg-white px-2 py-1 dark:border-slate-600 dark:bg-slate-800">
            <option>2</option><option>3</option><option>4</option>
          </select>
        </label>
        <fieldset class="space-y-2">
          <legend class="text-sm"><span data-i18n="colors"></span> / <span data-i18n="percent"></span></legend>
      <div id="row0" class="flex items-center gap-3">
        <input id="color0" type="color" value="#f4efe6" class="h-9 w-12 cursor-pointer rounded border border-slate-300 dark:border-slate-600" />
        <span class="w-20 text-sm"><span data-i18n="base"></span></span>
      </div>
      <div id="row1" class="flex items-center gap-3">
        <input id="color1" type="color" value="#1d4e9e" class="h-9 w-12 cursor-pointer rounded border border-slate-300 dark:border-slate-600" />
        <span class="w-20 text-sm"><span><span data-i18n="raised"></span> 1</span></span><input id="pct1" type="number" min="0" max="100" value="100" class="w-20 rounded border border-slate-300 bg-white px-2 py-1 dark:border-slate-600 dark:bg-slate-800" />
      </div>
      <div id="row2" class="flex items-center gap-3 hidden">
        <input id="color2" type="color" value="#d9a21b" class="h-9 w-12 cursor-pointer rounded border border-slate-300 dark:border-slate-600" />
        <span class="w-20 text-sm"><span><span data-i18n="raised"></span> 2</span></span><input id="pct2" type="number" min="0" max="100" value="0" class="w-20 rounded border border-slate-300 bg-white px-2 py-1 dark:border-slate-600 dark:bg-slate-800" />
      </div>
      <div id="row3" class="flex items-center gap-3 hidden">
        <input id="color3" type="color" value="#2f7d4f" class="h-9 w-12 cursor-pointer rounded border border-slate-300 dark:border-slate-600" />
        <span class="w-20 text-sm"><span><span data-i18n="raised"></span> 3</span></span><input id="pct3" type="number" min="0" max="100" value="0" class="w-20 rounded border border-slate-300 bg-white px-2 py-1 dark:border-slate-600 dark:bg-slate-800" />
      </div>
        </fieldset>
        <label class="block text-sm"><span data-i18n="coverage"></span> <span class="text-slate-500" data-i18n="coverageHint"></span>
          <input id="coverage" type="number" min="30" max="90" value="60" class="mt-1 block w-full rounded border border-slate-300 bg-white px-2 py-1 dark:border-slate-600 dark:bg-slate-800" />
        </label>
        <label class="block text-sm"><span data-i18n="complexity"></span>
          <select id="complexity" class="mt-1 block w-full rounded border border-slate-300 bg-white px-2 py-1 dark:border-slate-600 dark:bg-slate-800">
            <option value="auto" data-i18n="cxAuto"></option>
            <option value="1" data-i18n="cx1"></option>
            <option value="2" data-i18n="cx2" selected></option>
            <option value="3" data-i18n="cx3"></option>
            <option value="4" data-i18n="cx4"></option>
          </select>
        </label>
        <label class="block text-sm"><span data-i18n="border"></span>
          <select id="border" class="mt-1 block w-full rounded border border-slate-300 bg-white px-2 py-1 dark:border-slate-600 dark:bg-slate-800">
            <option value="on" data-i18n="borderOn"></option>
            <option value="off" data-i18n="borderOff"></option>
            <option value="random" data-i18n="borderRandom"></option>
          </select>
        </label>
        <label class="block text-sm"><span data-i18n="frameColor"></span>
          <select id="frameColor" class="mt-1 block w-full rounded border border-slate-300 bg-white px-2 py-1 disabled:opacity-40 dark:border-slate-600 dark:bg-slate-800">
            <option value="auto" data-i18n="frameAuto"></option>
            <option value="1"></option><option value="2"></option><option value="3"></option>
          </select>
        </label>
        <div class="flex items-center gap-2 text-sm">
          <span data-i18n="seed"></span>: <output id="seed" class="font-mono">-</output>
        </div>
        <div class="flex gap-2">
          <button id="generate" type="button" data-i18n="generate" class="rounded bg-blue-600 px-4 py-2 text-white"></button>
          <button id="update" type="button" data-i18n="update" disabled class="rounded border border-slate-300 px-4 py-2 disabled:opacity-40 dark:border-slate-600"></button>
        </div>
      </form>
    </section>

    <section class="space-y-4">
      <div class="flex items-center gap-2">
        <h2 class="mr-auto text-lg font-medium" data-i18n="preview"></h2>
        <button id="tab2d" type="button" data-i18n="view2d" class="rounded border border-slate-300 px-3 py-1 text-sm dark:border-slate-600"></button>
        <button id="tab3d" type="button" disabled data-i18n="view3d" class="rounded border border-slate-300 px-3 py-1 text-sm disabled:opacity-40 dark:border-slate-600"></button>
      </div>
      <div class="relative flex aspect-square max-h-[32rem] items-center justify-center rounded border border-dashed border-slate-300 dark:border-slate-600">
        <canvas id="preview" class="hidden max-h-full max-w-full"></canvas>
        <canvas id="view3d" class="hidden h-full w-full"></canvas>
        <button id="resetView" type="button" data-i18n="resetView" class="absolute right-2 top-2 hidden rounded border border-slate-300 bg-white px-2 py-1 text-xs dark:border-slate-600 dark:bg-slate-800"></button>
        <p id="previewEmpty" class="p-4 text-center text-sm text-slate-500" data-i18n="previewEmpty"></p>
      </div>
      <h2 class="text-lg font-medium" data-i18n="report"></h2>
      <div id="report" class="space-y-1 rounded border border-slate-200 p-3 text-sm dark:border-slate-700"></div>
      <div class="flex flex-wrap gap-2">
        <button id="saveSvg" type="button" disabled data-i18n="saveSvg" class="rounded border border-slate-300 px-3 py-2 disabled:opacity-40 dark:border-slate-600"></button>
        <button id="savePng" type="button" disabled data-i18n="savePng" class="rounded border border-slate-300 px-3 py-2 disabled:opacity-40 dark:border-slate-600"></button>
        <button id="open3d" type="button" disabled data-i18n="settings3d" class="rounded border border-slate-300 px-3 py-2 disabled:opacity-40 dark:border-slate-600"></button>
        <button id="save3mf" type="button" disabled data-i18n="save3mf" class="rounded border border-slate-300 px-3 py-2 disabled:opacity-40 dark:border-slate-600"></button>
        <button id="saveBundle" type="button" disabled data-i18n="saveBundle" class="rounded border border-slate-300 px-3 py-2 disabled:opacity-40 dark:border-slate-600"></button>
        <button id="clear" type="button" disabled data-i18n="clear" class="rounded border border-red-300 px-3 py-2 text-red-700 disabled:opacity-40 dark:border-red-800 dark:text-red-400"></button>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="exportJson" type="button" disabled data-i18n="exportJson" class="rounded border border-slate-300 px-3 py-2 disabled:opacity-40 dark:border-slate-600"></button>
        <button id="copyJson" type="button" disabled data-i18n="copyJson" class="rounded border border-slate-300 px-3 py-2 disabled:opacity-40 dark:border-slate-600"></button>
      </div>
      <p id="info3d" class="text-sm text-slate-500"></p>
      <h2 class="text-lg font-medium" data-i18n="importTitle"></h2>
      <label class="block text-sm"><span data-i18n="importPaste"></span>
        <textarea id="importText" rows="4" class="mt-1 block w-full rounded border border-slate-300 bg-white px-2 py-1 font-mono text-xs dark:border-slate-600 dark:bg-slate-800"></textarea>
      </label>
      <label class="block text-sm"><span data-i18n="importFile"></span>
        <input id="importFile" type="file" accept=".json,application/json" class="mt-1 block text-sm" />
      </label>
      <button id="importBtn" type="button" data-i18n="importBtn" class="rounded bg-blue-600 px-4 py-2 text-white"></button>
      <div id="importMsg" class="space-y-1 text-xs"></div>
    </section>
    </div>
  </main>

  <footer class="border-t border-slate-200 bg-white p-4 text-center text-xs text-slate-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-400">
    <span id="footerDate"></span> | <span id="footerVersion"></span> | by <a href="https://azseashell.com" class="underline hover:text-slate-700 dark:hover:text-slate-300">AZSeashell</a> | <a href="https://github.com/emanuelmoniz/Portuguese-Tile-Generator" class="underline hover:text-slate-700 dark:hover:text-slate-300">GitHub</a>
  </footer>

  <dialog id="dlg3d" class="m-auto w-80 rounded bg-white p-6 text-slate-900 backdrop:bg-black/50 dark:bg-slate-800 dark:text-slate-100">
    <h2 class="text-lg font-medium" data-i18n="dlg3d"></h2>
    <form id="form3d" method="dialog" class="mt-4 space-y-4">
      <label class="block text-sm"><span data-i18n="emboss"></span> <span class="text-slate-500" data-i18n="embossHint"></span>
        <input id="emboss" type="number" min="0" max="5" step="0.01" value="0.05" class="mt-1 block w-full rounded border border-slate-300 bg-white px-2 py-1 dark:border-slate-600 dark:bg-slate-800" />
      </label>
      <p data-err="emboss" class="text-xs text-red-600 dark:text-red-400"></p>
      <label class="block text-sm"><span data-i18n="plate"></span> <span class="text-slate-500" data-i18n="plateHint"></span>
        <input id="plate" type="number" min="1" max="10" step="0.1" value="3" class="mt-1 block w-full rounded border border-slate-300 bg-white px-2 py-1 dark:border-slate-600 dark:bg-slate-800" />
      </label>
      <p data-err="plate" class="text-xs text-red-600 dark:text-red-400"></p>
      <div class="flex gap-2">
        <button id="gen3mf" type="submit" data-i18n="gen3mf" class="rounded bg-blue-600 px-4 py-2 text-white"></button>
        <button id="cancel3d" type="button" data-i18n="cancel" class="rounded border border-slate-300 px-4 py-2 dark:border-slate-600"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgUpdate" class="m-auto w-96 rounded bg-white p-6 text-slate-900 backdrop:bg-black/50 dark:bg-slate-800 dark:text-slate-100">
    <h2 class="text-lg font-medium" data-i18n="dlgUpdate"></h2>
    <p id="dlgUpdateMsg" class="mt-4 text-sm"></p>
    <div class="mt-4 flex flex-wrap gap-2">
      <button id="dlgNew" type="button" data-i18n="dlgNew" class="rounded bg-blue-600 px-4 py-2 text-white"></button>
      <button id="dlgOnly" type="button" data-i18n="dlgOnly" class="rounded border border-slate-300 px-4 py-2 dark:border-slate-600"></button>
      <button id="dlgCancel" type="button" data-i18n="cancel" class="rounded border border-slate-300 px-4 py-2 dark:border-slate-600"></button>
    </div>
  </dialog>

  <script src="vendor/clipper.js"></script>
  <script src="vendor/earcut.min.js"></script>
  <script src="vendor/fflate.min.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/check.js"></script>
  <script src="js/motifs.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/mesh3mf.js"></script>
  <script src="js/export.js"></script>
  <script src="js/i18n.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="js/viewer3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
